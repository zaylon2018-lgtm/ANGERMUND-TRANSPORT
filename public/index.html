<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Angermund Transport ERP</title>
<style>
body{margin:0;font-family:Arial;background:#08111d;color:#fff;background-image:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.75)),url('truck-bg.jpg');background-size:cover}
.login{max-width:400px;margin:80px auto;background:#111;padding:25px;border-radius:15px}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:0}
button{background:#1877f2;color:#fff;font-weight:bold}
.dashboard{display:none;padding:20px}
.card{background:rgba(20,20,20,.8);padding:20px;border-radius:14px;margin-bottom:15px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="login" id="login">
<h1>ANGERMUND TRANSPORT</h1>
<p>Supabase ERP Login</p>
<input id="url" placeholder="Supabase URL">
<input id="key" placeholder="Supabase Anon Key">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="dashboard" id="dashboard">
<h1>Transport ERP Dashboard</h1>
<div class="card">
<h2>Trips</h2>
<p>Track all SA trips, KM, fuel, permits and profit.</p>
</div>
<div class="card">
<h2>Fleet</h2>
<p>Editable truck and trailer management.</p>
</div>
<div class="card">
<h2>GPS & WhatsApp</h2>
<p>Ready for future integration.</p>
</div>
<button onclick="logout()">Logout</button>
</div>

<script>
let supabase;

async function login(){
  const url=document.getElementById('url').value;
  const key=document.getElementById('key').value;
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;

  localStorage.setItem('sb_url',url);
  localStorage.setItem('sb_key',key);

  supabase = window.supabase.createClient(url,key);

  const {data,error}=await supabase.auth.signInWithPassword({
    email,password
  });

  if(error){alert(error.message);return;}

  document.getElementById('login').style.display='none';
  document.getElementById('dashboard').style.display='block';
}

function logout(){
 localStorage.clear();
 location.reload();
}

window.onload=()=>{
 const url=localStorage.getItem('sb_url');
 const key=localStorage.getItem('sb_key');
 if(url) document.getElementById('url').value=url;
 if(key) document.getElementById('key').value=key;
}
</script>
</body>
</html>
